function buildMessage(){const d=buildSaveData(),lines=[`📋 *Inventario ${d.tipo.toLowerCase()}*`,`Sucursal: ${d.sucursal||'—'}`,`Fecha: ${d.fecha||'—'}${d.dia?' ('+d.dia+')':''}`,`N° de conteo: ${d.conteo||'—'}`,`Hora de inicio: ${formatHora(horaInicio)}`,''];categories.forEach((cat,ci)=>{const ls=[];cat.items.forEach((item,ii)=>{if(!itemHasData(ci,ii))return;const p=[];cat.fields.forEach(f=>{const e=el(`q-${ci}-${ii}-${f.key}`);if(e&&e.value.trim()!=='')p.push(`${f.label} ${e.value}`)});const t=getItemTotal(ci,ii);if(t.hasKnown)p.push(`Total ${fmtNum(t.total)} ${cat.unit}`);ls.push(`• ${item.name}${item.code?' ('+item.code+')':''}: ${p.join(', ')}`)});if(ls.length)lines.push(`*${cat.icon} ${cat.name}*`,...ls,'')});lines.push(`Contado por: ${d.contadoPor||'—'}`);return lines.join('\n')}

function buildPDFDoc(){const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'}),d=buildSaveData(),green=[0,101,62],pale=[231,241,236],margin=38,pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight();doc.setFillColor(...green);doc.rect(0,0,pageW,58,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(`Control de inventario ${d.tipo.toLowerCase()}`,margin,31);doc.setFontSize(9);doc.text('INVERSIONES BLUMARO, S.A.',margin,45);doc.setTextColor(30,36,32);doc.setFontSize(9);doc.text(`Sucursal: ${d.sucursal||'—'}`,margin,77);doc.text(`Fecha: ${d.fecha||'—'}`,220,77);doc.text(`N.º: ${d.conteo||'—'}`,430,77);doc.text(`Contado por: ${d.contadoPor||'—'}`,margin,91);let y=108;categories.forEach((cat,ci)=>{const cols=['Código','Artículo',...cat.fields.map(f=>f.label),'Total'],fieldW=48,totalW=62,codeW=48,nameW=pageW-margin*2-codeW-fieldW*cat.fields.length-totalW,widths=[codeW,nameW,...cat.fields.map(()=>fieldW),totalW];if(y+50>pageH-35){doc.addPage();y=35}doc.setFillColor(...green);doc.rect(margin,y,pageW-margin*2,18,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(cat.name.toUpperCase(),margin+4,y+12);y+=18;doc.setFillColor(...pale);doc.rect(margin,y,pageW-margin*2,16,'F');doc.setTextColor(0,74,45);doc.setFontSize(7.5);let x=margin;cols.forEach((h,i)=>{doc.text(h,x+3,y+11);x+=widths[i]});y+=16;cat.items.forEach((item,ii)=>{if(y+15>pageH-35){doc.addPage();y=35}const vals=cat.fields.map(f=>el(`q-${ci}-${ii}-${f.key}`)?.value||''),t=getItemTotal(ci,ii),row=[item.code||'',item.name,...vals,t.hasKnown?fmtNum(t.total):''];doc.setTextColor(30,36,32);doc.setFont('helvetica','normal');doc.setFontSize(7);x=margin;row.forEach((v,i)=>{const txt=doc.splitTextToSize(String(v),widths[i]-6)[0]||'';doc.text(txt,x+3,y+10);x+=widths[i]});doc.setDrawColor(220);doc.line(margin,y+14,pageW-margin,y+14);y+=15});y+=8});const fn=`Inventario_${d.tipo}_${(d.sucursal||'sucursal').replace const cloudStatus=el('cloudStatus'),historyList=el('historyList');
function setCloudStatus(m,t=''){cloudStatus.textContent=m;cloudStatus.className='cloud-status'+(t?' '+t:'')}
function apiUrl(p={}){const u=new URL(APPS_SCRIPT_URL);u.searchParams.set('key',APPS_SCRIPT_KEY);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v??''));return u.toString()}
async function parseApiResponse(r){const txt=await r.text();let d;try{d=JSON.parse(txt)}catch(_){throw new Error('Apps Script no respondió con JSON. Verifica la implementación /exec y el acceso público.')}if(!d.ok)throw new Error(d.error||'Error de Google');return d}

function numericConteos(rs){return rs.map(r=>parseInt(String(r.conteo).match(/\d+/)?.[0]||'',10)).filter(Number.isFinite)}
async function getHistory(show=true){const suc=sucursalSelect.value.trim(),tipo=currentType();if(!suc){setCloudStatus('Selecciona una sucursal primero.','error');return[]}setCloudStatus(`Consultando inventarios ${tipo.toLowerCase()}…`);const d=await apiGet({action:'list',sucursal:suc,tipo}),rs=d.records||[];rs.sort((a,b)=>(parseInt(b.conteo)||0)-(parseInt(a.conteo)||0));if(show){historyList.innerHTML='';if(!rs.length)historyList.innerHTML='<div class="history-meta">No hay inventarios guardados de este tipo.</div>';rs.forEach(r=>{const row=document.createElement('div');row.className='history-row';const left=document.createElement('div');left.innerHTML=`<strong>${r.tipo||tipo} · Inventario ${r.conteo}</strong><div class="history-meta">${r.sucursal||suc}${r.fecha?' · '+r.fecha:''}${r.contadoPor?' · '+r.contadoPor:''}</div>`;row.appendChild(left);const actions=document.createElement('div');actions.style.display='flex';actions.style.gap='6px';const b=document.createElement('button');b.className='history-load';b.textContent='Cargar';b.onclick=()=>loadCloud(r.conteo);actions.appendChild(b);if(r.pdfUrl){const p=document.createElement('button');p.className='history-load';p.textContent='PDF';p.onclick=()=>window.open(r.pdfUrl,'_blank');actions.appendChild(p)}row.appendChild(actions);historyList.appendChild(row)});historyList.classList.add('show')}setCloudStatus(`${rs.length} inventario(s) ${tipo.toLowerCase()} encontrado(s).`,'ok');return rs}

async function saveCloud(asNew=false){let d=buildSaveData();if(!d.sucursal)return setCloudStatus('Selecciona una sucursal.','error');try{if(asNew){const rs=await getHistory(false),ns=numericConteos(rs);d.conteo=String(ns.length?Math.max(...ns)+1:1);conteoInput.value=d.conteo}if(!d.conteo)return setCloudStatus('Indica un número o usa Guardar como nuevo.','error');setCloudStatus('Generando PDF y guardando en Google…');d=buildSaveData();const pdf=buildPdfPayload();const o=await apiPost({...d,...pdf,action:'save'});setCloudStatus(`${o.message} ${d.tipo} · ${d.sucursal} · N.º ${d.conteo}`,'ok');showToast(o.message);historyList.classList.remove('show')}catch(e){setCloudStatus(e.message,'error')}}
